<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="auto" role="img" aria-labelledby="title desc">
  <title id="title">Claim to Chart Comparison Visual: Example Adoption Claim</title>
  <desc id="desc">Visual preview of a verified comparison chart showing source annotations, 12px offset layers, and checked primary claim</desc>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=Gloock&amp;family=JetBrains+Mono:wght@400;500&amp;family=Cedarville+Cursive&amp;display=swap');
      text { font-family: "Bricolage Grotesque", system-ui, -apple-system, sans-serif; }
      .mono { font-family: "JetBrains Mono", ui-monospace, monospace; }
      .serif { font-family: "Gloock", Georgia, serif; }
      .hand { font-family: "Cedarville Cursive", cursive; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="520" fill="#FBF7EC" stroke="#1C1D38" stroke-width="2"/>

  <!-- Card Outer Offset Border Frame -->
  <rect x="24" y="24" width="752" height="472" fill="none" stroke="#1C1D38" stroke-width="2"/>

  <!-- Header Section -->
  <text x="48" y="58" font-size="13" font-weight="600" letter-spacing="2" fill="#1C1D38" text-transform="uppercase">CLAIM TO CHART · WORKED EXAMPLE</text>
  <text x="48" y="92" font-size="28" font-weight="800" fill="#1C1D38" letter-spacing="-0.5">Daily AI Tool Usage in Engineering Teams</text>
  <text x="48" y="118" font-size="14" font-weight="400" fill="#1C1D38">Example claim: &quot;68% of engineers use daily AI tools vs 24% baseline&quot; (made-up demo data)</text>

  <!-- Chart Gridlines & Axis Labels -->
  <!-- 100% -->
  <line x1="100" y1="160" x2="680" y2="160" stroke="#848499" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="90" y="164" class="mono" font-size="12" fill="#1C1D38" text-anchor="end">100%</text>

  <!-- 75% -->
  <line x1="100" y1="218" x2="680" y2="218" stroke="#848499" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="90" y="222" class="mono" font-size="12" fill="#1C1D38" text-anchor="end">75%</text>

  <!-- 50% -->
  <line x1="100" y1="275" x2="680" y2="275" stroke="#848499" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="90" y="279" class="mono" font-size="12" fill="#1C1D38" text-anchor="end">50%</text>

  <!-- 25% -->
  <line x1="100" y1="332" x2="680" y2="332" stroke="#848499" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="90" y="336" class="mono" font-size="12" fill="#1C1D38" text-anchor="end">25%</text>

  <!-- 0% Baseline Axis -->
  <line x1="100" y1="390" x2="680" y2="390" stroke="#1C1D38" stroke-width="2.5"/>
  <text x="90" y="394" class="mono" font-size="12" fill="#1C1D38" font-weight="700" text-anchor="end">0%</text>

  <!-- Bar 1: Baseline (24%) - Fog offset -->
  <rect x="172" y="347" width="100" height="55" fill="#848499"/>
  <rect x="160" y="335" width="100" height="55" fill="#FBF7EC" stroke="#1C1D38" stroke-width="2"/>
  <text x="210" y="322" font-size="18" font-weight="700" fill="#1C1D38" text-anchor="middle">24%</text>
  <text x="210" y="414" font-size="14" font-weight="600" fill="#1C1D38" text-anchor="middle">General baseline</text>
  <text x="210" y="430" class="mono" font-size="11" fill="#1C1D38" text-anchor="middle">All workers</text>

  <!-- Bar 2: Product Teams (45%) - Fog offset -->
  <rect x="332" y="298" width="100" height="104" fill="#848499"/>
  <rect x="320" y="286" width="100" height="104" fill="#FBF7EC" stroke="#1C1D38" stroke-width="2"/>
  <text x="370" y="273" font-size="18" font-weight="700" fill="#1C1D38" text-anchor="middle">45%</text>
  <text x="370" y="414" font-size="14" font-weight="600" fill="#1C1D38" text-anchor="middle">Product teams</text>
  <text x="370" y="430" class="mono" font-size="11" fill="#1C1D38" text-anchor="middle">Survey sample</text>

  <!-- Bar 3: Engineering Teams (68% - The focal claim!) -->
  <rect x="492" y="245" width="100" height="157" fill="#848499"/>
  <rect x="480" y="233" width="100" height="157" fill="#52CFDE" stroke="#1C1D38" stroke-width="2"/>
  <text x="530" y="220" font-size="22" font-weight="800" fill="#1C1D38" text-anchor="middle">68%</text>
  <text x="530" y="414" font-size="14" font-weight="800" fill="#1C1D38" text-anchor="middle">Engineering teams</text>
  <text x="530" y="430" class="mono" font-size="11" fill="#1C1D38" text-anchor="middle">Primary claim</text>

  <!-- Checked Badge on Focal Bar -->
  <rect x="482" y="147" width="126" height="28" fill="#848499"/>
  <rect x="470" y="135" width="126" height="28" fill="#D2EE63" stroke="#1C1D38" stroke-width="2"/>
  <text x="533" y="154" font-size="13" font-weight="800" fill="#1C1D38" text-anchor="middle">✓ CHECKED CLAIM</text>
<!-- Source Citation Footnote Block (clearly labelled EXAMPLE with made-up content) -->
  <rect x="58" y="457" width="548" height="26" fill="#848499"/>
  <rect x="48" y="447" width="548" height="26" fill="#FBF7EC" stroke="#1C1D38" stroke-width="1.5"/>
  <text x="60" y="464" class="mono" font-size="11" fill="#1C1D38">EXAMPLE SOURCE: Simulated study citation for skill layout (not real research)</text>

  <!-- Footer Stamp -->
  <text x="748" y="474" class="mono" font-size="12" font-weight="500" fill="#1C1D38" text-anchor="end">richshed.com</text>
</svg>