<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="auto" role="img" aria-labelledby="title desc">
  <title id="title">Intent Mirror Card Visual: Confirmed Goals and Boundary Checks</title>
  <desc id="desc">Visual preview of an intent mirror card showing confirmed goals, boundary checks, and next steps</desc>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=Gloock&amp;family=JetBrains+Mono:wght@400;500&amp;family=Cedarville+Cursive&amp;display=swap');
      text { font-family: "Bricolage Grotesque", system-ui, -apple-system, sans-serif; }
      .mono { font-family: "JetBrains Mono", ui-monospace, monospace; }
      .serif { font-family: "Gloock", Georgia, serif; }
      .hand { font-family: "Cedarville Cursive", cursive; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="520" fill="#FBF7EC" stroke="#1C1D38" stroke-width="2"/>

  <!-- Card Outer Frame -->
  <rect x="24" y="24" width="752" height="472" fill="none" stroke="#1C1D38" stroke-width="2"/>

  <!-- Header Section -->
  <text x="48" y="58" font-size="13" font-weight="600" letter-spacing="2" fill="#1C1D38" text-transform="uppercase">INTENT MIRROR · WORKED EXAMPLE</text>
  <text x="48" y="92" font-size="28" font-weight="800" fill="#1C1D38" letter-spacing="-0.5">Intent Mirror Card</text>
  <text x="48" y="118" font-size="14" font-weight="400" fill="#1C1D38">EXAMPLE: Playback from sample voice note (184 words) · Paused for human sign-off</text>

  <!-- LEFT TOP CARD: What you want (12px Fog Offset, Clean Typographic Heading) -->
  <rect x="60" y="147" width="330" height="138" fill="#848499"/>
  <rect x="48" y="135" width="330" height="138" fill="#FBF7EC" stroke="#1C1D38" stroke-width="2"/>
  <text x="68" y="162" font-size="15" font-weight="800" fill="#1C1D38">What you want</text>
  <text x="68" y="188" font-size="12.5" font-weight="600" fill="#1C1D38">1. Accessible contact postcard component</text>
  <text x="68" y="210" font-size="12.5" font-weight="400" fill="#1C1D38">2. Full keyboard navigation with visible focus</text>
  <text x="68" y="232" font-size="12.5" font-weight="400" fill="#1C1D38">3. Client-side validation; zero database storage</text>
  <text x="68" y="254" class="mono" font-size="11" fill="#1C1D38">Goal scope: 3 clear deliverables</text>

  <!-- LEFT BOTTOM CARD: Boundaries & Defaults (12px Fog Offset, Clean Heading) -->
  <rect x="60" y="299" width="330" height="126" fill="#848499"/>
  <rect x="48" y="287" width="330" height="126" fill="#FBF7EC" stroke="#1C1D38" stroke-width="2"/>
  <text x="68" y="314" font-size="15" font-weight="800" fill="#1C1D38">Level 1 Operator Boundaries</text>
  <text x="68" y="340" font-size="12.5" font-weight="400" fill="#1C1D38">● Scope: 3 input fields max (Name, Email, Note)</text>
  <text x="68" y="362" font-size="12.5" font-weight="400" fill="#1C1D38">● Privacy: zero telemetry or tracking scripts</text>
  <text x="68" y="384" font-size="12.5" font-weight="400" fill="#1C1D38">● Reversible: pure HTML/CSS; easily reverted</text>

  <!-- RIGHT CARD: Next Step & Human Gate (Focal Card with Pool #52CFDE 12px Offset) -->
  <rect x="422" y="147" width="330" height="278" fill="#52CFDE"/>
  <rect x="410" y="135" width="330" height="278" fill="#FBF7EC" stroke="#1C1D38" stroke-width="2"/>
  <text x="430" y="162" font-size="15" font-weight="800" fill="#1C1D38">→ Next step (Paused at gate)</text>
  <text x="430" y="188" font-size="12.5" font-weight="400" fill="#1C1D38">Draft the accessible postcard HTML and CSS,</text>
  <text x="430" y="206" font-size="12.5" font-weight="400" fill="#1C1D38">then show it to you for review before saving.</text>

  <!-- Lime Outcome Status Block -->
  <rect x="438" y="234" width="274" height="46" fill="#848499"/>
  <rect x="430" y="226" width="274" height="46" fill="#D2EE63" stroke="#1C1D38" stroke-width="2"/>
  <text x="567" y="255" font-size="14" font-weight="800" fill="#1C1D38" text-anchor="middle">✓ MIRROR CONFIRMED · 184 WORDS</text>

  <!-- Interactive Question Box -->
  <rect x="430" y="300" width="274" height="42" fill="#1C1D38"/>
  <text x="444" y="326" class="mono" font-size="13" fill="#52CFDE">&gt; Shall we start? [Yes / Fix]</text>

  <!-- Decision Helper Note -->
  <text x="567" y="372" font-size="12" font-weight="600" fill="#1C1D38" text-anchor="middle">&quot;Yes&quot; accepts defaults · or tell me what to fix</text>
<!-- Footer Stamp -->
  <text x="748" y="474" class="mono" font-size="12" font-weight="500" fill="#1C1D38" text-anchor="end">richshed.com</text>
</svg>